<div class="fondo-login">
  <main id="contenido" class="caja-login">
    <div class="text-end mb-2"><app-selector-idioma /></div>

    <div class="logo" aria-hidden="true"><i class="bi bi-heart-pulse-fill"></i></div>
    <h1 class="h3 text-center fw-semibold mb-1">MediTurno</h1>
    <p class="text-center text-muted mb-4">{{ i.t('lema') }}</p>

    <form (ngSubmit)="entrar()">
      <div class="mb-3">
        <label for="email" class="form-label">{{ i.t('correo') }}</label>
        <div class="input-group">
          <span class="input-group-text" aria-hidden="true"><i class="bi bi-envelope"></i></span>
          <input id="email" name="email" type="email" class="form-control"
                 [(ngModel)]="email" required autocomplete="email">
        </div>
      </div>

      <div class="mb-3">
        <label for="password" class="form-label">{{ i.t('clave') }}</label>
        <div class="input-group">
          <span class="input-group-text" aria-hidden="true"><i class="bi bi-lock"></i></span>
          <input id="password" name="password" type="password" class="form-control"
                 [(ngModel)]="password" required autocomplete="current-password">
        </div>
      </div>

      @if (error) {
        <div class="alert alert-danger" role="alert">{{ i.t(error) }}</div>
      }

      <button type="submit" class="btn btn-primary w-100 py-2"
              [disabled]="!email || !password">
        <i class="bi bi-box-arrow-in-right me-1" aria-hidden="true"></i>{{ i.t('login') }}
      </button>
    </form>
      <div class="text-center text-muted my-3">{{ i.t('o') }}</div>
      <div id="boton-google" class="d-flex justify-content-center"></div>
  </main>
</div>
